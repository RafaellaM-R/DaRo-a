<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fazer cadastro - DaRoça</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@1,300&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Merienda:wght@300..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: url('../imagens/imagemdoFazendoCadastro.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      backdrop-filter: blur(4px);
      padding-top: 100px;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #00000041;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      z-index: 1000;
      backdrop-filter: blur(3px);
    }

    header img {
      width: 100px;
    }

    #lista {
      list-style: none;
      display: flex;
      padding: 0;
      margin: 0;
    }

    #lista li {
      margin: 0 13px;
      font-family: Verdana, Geneva, Tahoma, sans-serif;
    }

    header li > a {
      text-decoration: none;
      color: rgb(40, 61, 14);
      background-color: rgba(255, 255, 255, 0.529);
      padding: 6px 10px;
      border-radius: 12px;
      transition: 0.3s;
    }

    header li > a:hover {
      background-color: rgba(255, 255, 255, 0.8);
    }

    .search-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .material-icons {
      font-size: 28px;
      color: rgb(251, 253, 250);
      cursor: pointer;
    }

    .search-btn {
      background: none;
      border: none;
      cursor: pointer;
    }

    .search-input {
      width: 0;
      opacity: 0;
      padding: 5px 10px;
      margin-left: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input.active {
      width: 200px;
      opacity: 1;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 350px;
      animation: fadeIn 1s ease-in-out;
    }

    h2 {
      margin-bottom: 20px;
      color: #1b4332;
      font-weight: 600;
    }

    label {
      display: block;
      margin-top: 10px;
      text-align: left;
      color: #2d6a4f;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 10px;
      border: 1px solid #95d5b2;
      background-color: #f0fff4;
      font-size: 14px;
      transition: 0.2s;
    }

    input:focus {
      border-color: #52b788;
      outline: none;
      background-color: #e9ffe9;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background-color: #40916c;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #52b788;
      transform: scale(1.05);
    }

    a {
      color: #2d6a4f;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }

    a:hover {
      color: #40916c;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <header>
    <div><img src="/imagens/ChatGPT Image 19 de ago. de 2025, 20_44_53.png" alt="Logo"></div>
    <div>
      <ul id="lista">
        <li><a href="Projeto_paginaInicial.html">Home</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="cadastro.html">Cadastrar</a></li>
        <li><a href="#catalogooo">Catálogo</a></li>
        <li><a href="receitas.html">Receitas</a></li>
      </ul>
    </div>
    <div class="search-container">
      <span class="material-icons search-btn">search</span>
      <input type="text" class="search-input" placeholder="Pesquisar...">
      <a href="carrinho.html"><span class="material-icons">shopping_cart</span></a>
    </div>
  </header>

  <div class="card">
    <h2>Crie sua conta</h2>
    <form id="formCadastro">
      <label>Nome:</label>
      <input type="text" id="nome" required />

      <label>Email:</label>
      <input type="email" id="email" required />

      <label>Senha:</label>
      <input type="password" id="senha" required />

      <label>Confirmar Senha:</label>
      <input type="password" id="confirmarSenha" required />

      <button type="submit">Cadastrar</button>
    </form>
  </div>

  <script>
    document.getElementById("formCadastro").addEventListener("submit", async (e) => {
  e.preventDefault();

  const nome = document.getElementById("nome").value.trim();
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;
  const confirmarSenha = document.getElementById("confirmarSenha").value;

  if (senha !== confirmarSenha) {
    alert("As senhas não coincidem!");
    return;
  }

  try {
    const resposta = await fetch("http://localhost:8081/clientes/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({  email, senha })
    });

    const dados = await resposta.json();

    if (resposta.ok) {
      alert(`Bem-vindo(a), ${dados.cliente?.nome || "usuário"}!`);
      


      localStorage.setItem("token", dados.token);
      localStorage.setItem("id_cliente", dados.cliente.id_cliente);
      localStorage.setItem("nome_cliente", dados.cliente.nome);

      

      

      window.location.href = "projeto_paginaInicial.html";
    } else {
      alert(dados.erro || dados.mensagem || "Erro no cadastro. Tente novamente.");
    }

  } catch (erro) {
    console.error("Erro no fetch de cadastro:", erro);
    alert("Erro ao conectar com o servidor. Tente novamente mais tarde.");
  }
});


    // animação da barra de pesquisa
    const searchBtn = document.querySelector('.search-btn');
    const searchInput = document.querySelector('.search-input');
    searchBtn.addEventListener('click', () => {
      searchInput.classList.toggle('active');
      if (searchInput.classList.contains('active')) {
        searchInput.focus();
      }
    });


  </script>
</body>
</html>
